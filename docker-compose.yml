services:
  sotavpn-tunnel:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: sotavpn_tunnel
    restart: unless-stopped
    command: run -c /etc/sing-box/config.json
    volumes:
      - ./data/singbox_config.json:/etc/sing-box/config.json:ro
    ports:
      - "127.0.0.1:1080:1080"

  deal-auditor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deal_auditor_prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - BOT_TOKEN=${BOT_TOKEN:-}
      - WEBAPP_URL=${WEBAPP_URL:-http://localhost:8000}
      - SOTA_VPN_KEY=${SOTA_VPN_KEY:-}
      - TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL:-}
      - TUNNEL_PROXY_HOST=socks5://sotavpn-tunnel:1080
      - DATABASE_URL=sqlite+aiosqlite:////app/data/deals.db
    volumes:
      - ./data:/app/data
    depends_on:
      - sotavpn-tunnel
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/presets\").read()'"]
      interval: 30s
      timeout: 5s
      retries: 3
