services:
  deal-auditor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deal_auditor_prod
    user: root
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "24500:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - WEBAPP_URL=https://kolbaska.delyoself.site
      - DATABASE_URL=sqlite+aiosqlite:////app/data/deals.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/presets\").read()'"]
      interval: 30s
      timeout: 5s
      retries: 3
